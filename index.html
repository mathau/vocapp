@keyframes segmentPulse {
    0% { filter: brightness(1); }
    40% { filter: brightness(1.7); }

<script>


let words = [];

let current = null;

let checking = false;

let lastAnswerCorrect = null; // null = brak odpowiedzi, true/false po sprawdzeniu

let autoAdvanceTimer = null;

let currentListName = null; // nazwa aktualnie wybranego pliku csv

let csvHeaderLine = ""; // oryginalny nagłówek csv (do eksportu)

let csvSeparator = ","; // wykryty separator (do eksportu)


// Odczytuje nazwy języków z pierwszego wiersza csv (nagłówka) i wypełnia
// nimi listę wyboru kierunku tłumaczenia. Kolumna 1 = current.en,
// kolumna 2 = current.pl (te nazwy wewnętrzne zostają bez zmian - to
// zwykłe "kolumna 1 / kolumna 2", niezależnie od faktycznych języków).
// Domyślnie ustawiany jest kierunek: kolumna 2 -> kolumna 1.
function populateDirectionOptions(headerLine, separator){

    let parts = headerLine.split(separator);

    let lang1 = (parts[0] || "Kolumna 1").replace(/^\uFEFF/, "").replaceAll('"',"").trim();

    let lang2 = (parts[1] || "Kolumna 2").replace(/^\uFEFF/, "").replaceAll('"',"").trim();

    let select = document.getElementById("direction");

    select.innerHTML =
    '<option value="col2-col1">' + lang2 + ' → ' + lang1 + '</option>' +
    '<option value="col1-col2">' + lang1 + ' → ' + lang2 + '</option>';

    select.value = "col2-col1";

    select.style.display = "inline-block";

}

let comboCount = 0; // licznik kolejnych dobrych odpowiedzi w tej sesji (nie zapisywany do bazy)

let comboBeforeWrongAnswer = 0; // combo sprzed błędnej odpowiedzi - do przywrócenia po "Mam rację"


// ---- Dźwięk przy dobrej odpowiedzi ----
// Generowany na żywo (Web Audio API), bez żadnych plików - delikatny,
// dwutonowy "dzwoneczek" z miękkim, płynnym wybrzmieniem. Im dłuższe combo,
// tym bogatszy akord (dokładamy kolejne, wyższe tony).
let audioCtx = null;

function playCorrectSound(combo){

    try {

        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if(audioCtx.state === "suspended"){
            audioCtx.resume();
        }

        let now = audioCtx.currentTime;

        playTone(1046.5, now, 0.4);        // C6
        playTone(1318.5, now + 0.09, 0.4); // E6

        if(combo >= 3){
            playTone(1568.0, now + 0.18, 0.4); // G6
        }

        if(combo >= 5){
            playTone(2093.0, now + 0.27, 0.42); // C7
        }

        if(combo >= 10){
            playTone(2637.0, now + 0.36, 0.45); // E7 - finałowy akcent
        }

    }
    catch(error){

        console.log(error);

    }

}

function playTone(freq, startTime, duration){

    let osc = audioCtx.createOscillator();

    let gain = audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, startTime);

    gain.gain.linearRampToValueAtTime(0.25, startTime + 0.02); // łagodny atak

    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration); // miękkie wygaszenie

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start(startTime);

    osc.stop(startTime + duration + 0.05);

}

// ---- Dźwięk przy złej odpowiedzi ----
// Stonowany, opadający dwutonowy sygnał - niższy i cichszy niż dźwięk
// dobrej odpowiedzi, ale w tej samej, minimalistycznej stylistyce.
function playWrongSound(){

    try {

        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if(audioCtx.state === "suspended"){
            audioCtx.resume();
        }

        let now = audioCtx.currentTime;

        playTone(392.00, now, 0.35);        // G4
        playTone(329.63, now + 0.11, 0.35); // E4 (opadające)

    }
    catch(error){

        console.log(error);

    }

}


// ---- Combo / streak ----
// Licznik kolejnych dobrych odpowiedzi w bieżącej sesji (nie zapisywany
// do bazy - resetuje się przy złej odpowiedzi, zmianie listy albo wylogowaniu).
function updateComboDisplay(){

    let el = document.getElementById("comboDisplay");

    if(comboCount >= 3){

        let flame = (comboCount % 10 === 0) ? "🔥🔥" : "🔥";

        el.textContent = "Combo x" + comboCount + " " + flame;

        el.style.display = "block";

        el.classList.remove("combo-pulse");

        void el.offsetWidth; // wymuszenie reflow, żeby animacja odpaliła się ponownie

        el.classList.add("combo-pulse");

    }
    else{

        el.style.display = "none";

        el.textContent = "";

    }

}


function resetCombo(){

    comboCount = 0;

    updateComboDisplay();

}


// Rozjaśnia (pulsuje) tylko ten segment paska, do którego właśnie "wpadło"
// słówko po tej odpowiedzi - czerwony (do poprawy) jeśli wynik < 0,
// zielony (znam) jeśli wynik > 0. Gdy wynik wynosi dokładnie 0 (czyli
// słówko trafia/zostaje w "Pozostało") - świadomie NIE animujemy niczego,
// np. przejście -1 -> 0 nie ma podświetlać zielonego segmentu "znam".
// Działa niezależnie od wielkości listy, bo nie zależy od zmiany szerokości.
function pulseScoreSegment(newScore){

    let selector;

    if(newScore < 0){
        selector = ".progress-below";
    }
    else if(newScore > 0){
        selector = ".progress-known";
    }
    else{
        return; // score == 0 -> "pozostało", brak animacji
    }

    let el = document.querySelector("#progressBar " + selector);

    if(!el)
        return;

    el.classList.remove("segment-pulse");

    void el.offsetWidth; // wymuszenie reflow, żeby animacja odpaliła się ponownie

    el.classList.add("segment-pulse");

}


// Krótki, niewielki "wybuch" konfetti (czarno-białe, różne odcienie szarości) -
// bez żadnych bibliotek, kilka elementów, które wylatują na boki i znikają.
function triggerConfettiBurst(big){

    let container = document.createElement("div");

    container.className = "confetti-container";

    document.body.appendChild(container);

    let count = big ? 40 : 18;

    let colors = ["#000000", "#222222", "#444444", "#666666", "#999999"];

    for(let i=0; i<count; i++){

        let piece = document.createElement("div");

        piece.className = "confetti-piece";

        piece.style.background = colors[Math.floor(Math.random()*colors.length)];

        let angle = Math.random() * Math.PI * 2;

        let distance = (big ? 220 : 120) + Math.random()*80;

        let dx = Math.cos(angle) * distance;

        let dy = Math.sin(angle) * distance - 40; // lekko w górę

        piece.style.setProperty("--dx", dx + "px");

        piece.style.setProperty("--dy", dy + "px");

        piece.style.left = "50%";

        piece.style.top = "40%";

        piece.style.animationDelay = (Math.random()*0.1) + "s";

        container.appendChild(piece);

    }

    setTimeout(function(){
        container.remove();
    }, 1300);

}


// ---- Podświetlenie pola odpowiedzi ----
// Kolor ma się pojawiać NATYCHMIAST (bez przejścia), a znikać PŁYNNIE.
// Osiągamy to chwilowo wyłączając transition, dodając kolor, wymuszając
// przeliczenie stylów (reflow), a potem z powrotem włączając transition.
function flashAnswerField(className){

    let el = document.getElementById("answer");

    el.classList.remove("correct-flash", "wrong-flash");

    el.classList.add("no-transition");

    void el.offsetWidth; // wymuszenie reflow, żeby "no-transition" na pewno zadziałało

    el.classList.add(className);

    requestAnimationFrame(function(){
        el.classList.remove("no-transition");
    });

}


// Usuwa podświetlenie pola odpowiedzi - tym razem PŁYNNIE (transition już aktywne)
function clearAnswerFieldFlash(){

    let el = document.getElementById("answer");

    el.classList.remove("correct-flash", "wrong-flash");

}

// Zakres, w jakim mieści się wynik słówka. Ogranicza "uciekanie"
// wyniku w nieskończoność (jedna zła odpowiedź nie zniweczy 20 dobrych).
const MIN_SCORE = -3;
const MAX_SCORE = 5;

function clampScore(score){
    return Math.max(MIN_SCORE, Math.min(MAX_SCORE, score));
}


// tworzy stabilne, "bezpieczne" ID słówka na podstawie tekstu (do zapisu w Firestore)
function makeSafeId(text){

    return text
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // usuń polskie znaki diakrytyczne
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");

}


// ---- Konfiguracja repozytorium GitHub ----
// Zmień te wartości jeśli się nie zgadzają z Twoim repo
const GITHUB_OWNER = "mathau";
const GITHUB_REPO = "vocapp";
const GITHUB_BRANCH = "main";
const CSV_FOLDER = "wordbank"; // folder w repo, w którym trzymasz pliki csv
// -------------------------------------------


async function loadCsvFileList(){

    try {

        let url =
        "https://api.github.com/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO +
        "/contents/" + CSV_FOLDER + "?ref=" + GITHUB_BRANCH;

        let response = await fetch(url);

        if(!response.ok){

            document.getElementById("info").innerHTML =
            "Błąd ładowania listy plików (kod " + response.status + "). Sprawdź czy folder '" + CSV_FOLDER + "' istnieje w repo.";

            return;

        }

        let files = await response.json();

        let csvFiles = files.filter(function(f){
            return f.name.toLowerCase().endsWith(".csv");
        });

        let select = document.getElementById("csvList");

        select.innerHTML = '<option value="">Wybierz listę do nauki</option>';

        csvFiles.forEach(function(file){

            let option = document.createElement("option");

            option.value = file.download_url;

            option.textContent = file.name;

            select.appendChild(option);

        });

        document.getElementById("info").innerHTML =
        csvFiles.length > 0
        ? "Dostępne pliki do nauki: " + csvFiles.length + ". Wybierz z listy."
        : "Brak dostępnych plików do nauki.";

    }
    catch(error){

        console.log(error);

        document.getElementById("info").innerHTML =
        "Błąd: " + error.message;

    }

}


async function loadSelectedCsv(){

    let select = document.getElementById("csvList");

    let url = select.value;

    if(url == ""){
        resetToEmptyState();
        return;
    }

    currentListName = select.options[select.selectedIndex].textContent;

    document.getElementById("info").innerHTML = "Ładowanie pliku...";

    try {

        let response = await fetch(url);

        let text = await response.text();

        await loadWords(text);

    }
    catch(error){

        console.log(error);

        document.getElementById("info").innerHTML =
        "Błąd ładowania pliku: " + error.message;

    }

}


window.loadSelectedCsv = loadSelectedCsv;

window.addEventListener("DOMContentLoaded", loadCsvFileList);


// Przywraca aplikację do stanu "zero" - gdy użytkownik wybierze z powrotem
// pustą pozycję "Wybierz listę do nauki" w liście
function resetToEmptyState(){

    if(autoAdvanceTimer){
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
    }

    words = [];

    current = null;

    currentListName = null;

    checking = false;

    lastAnswerCorrect = null;

    document.getElementById("word").innerHTML = "-";

    document.getElementById("direction").innerHTML =
    '<option value="col2-col1">Wybierz listę słówek</option>';

    document.getElementById("direction").style.display = "none";

    document.getElementById("answer").value = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("overrideBtn").style.display = "none";

    document.getElementById("meaningEditBox").style.display = "none";

    clearAnswerFieldFlash();

    resetCombo();

    document.getElementById("info").innerHTML = "Nie wybrano pliku.";

    updateStats();

    updateAdminUI();

}




async function loadWords(text){


    words=[];

    resetCombo();


    let lines=text.split(/\r?\n/);

    csvHeaderLine = lines[0];


    // wykrycie separatora

    let separator=",";

    if(lines[0].includes(";")){
        separator=";";
    }

    csvSeparator = separator;


    populateDirectionOptions(csvHeaderLine, separator);



    for(let i=1;i<lines.length;i++){


        if(lines[i].trim()=="")
            continue;



        let row=lines[i].split(separator);



        if(row.length>=2){


            let en = row[0].replaceAll('"',"").trim();

            let pl = row[1].replaceAll('"',"").trim();

            words.push({

                id: makeSafeId(en),

                en: en,

                pl: pl,

                score: 0

            });


        }


    }



    await loadProgressForCurrentList();

    await loadMeaningsForCurrentList();


    updateStats();

    updateAdminUI();


    document.getElementById("info").innerHTML =
    "Załadowano: "+words.length+" słówek";


    nextWord();


}


// Doczytuje zapisany postęp (wyniki słówek) dla aktualnie wybranej listy
// i danego zalogowanego użytkownika. Jeśli nikt nie jest zalogowany - nic nie robi.
async function loadProgressForCurrentList(){

    if(!window.currentUser || !currentListName || words.length==0)
        return;

    try {

        let docId = window.currentUser.uid + "_" + makeSafeId(currentListName);

        let ref = window.fsDoc(window.db, "progress", docId);

        let snap = await window.fsGetDoc(ref);

        if(snap.exists()){

            let data = snap.data();

            words.forEach(function(w){

                if(typeof data[w.id] == "number"){
                    w.score = data[w.id];
                }

            });

        }

    }
    catch(error){

        console.log(error);

    }

}


// Zapisuje wynik pojedynczego słówka do Firestore (jeśli użytkownik jest zalogowany)
async function saveWordProgress(wordObj){

    if(!window.currentUser || !currentListName)
        return;

    try {

        let docId = window.currentUser.uid + "_" + makeSafeId(currentListName);

        let ref = window.fsDoc(window.db, "progress", docId);

        let payload = {};

        payload[wordObj.id] = wordObj.score;

        await window.fsSetDoc(ref, payload, { merge: true });

    }
    catch(error){

        console.log(error);

    }

}


// Wywoływane z modułu Firebase, gdy zmieni się stan logowania
// (np. użytkownik się zaloguje albo strona odświeży się z zapamiętaną sesją)
window.onAuthChangedReloadProgress = async function(){

    if(words.length > 0){

        if(window.currentUser){

            await loadProgressForCurrentList();

        }
        else{

            // wylogowano - wracamy do trybu gościa, więc wyniki resetują się do 0
            words.forEach(function(w){
                w.score = 0;
            });

            resetCombo();

        }

        updateStats();

    }

    updateAdminUI();

};


// Doczytuje poprawki znaczeń dla aktualnie wybranej listy (współdzielone,
// widoczne dla wszystkich - nie trzeba być zalogowanym żeby je zobaczyć)
async function loadMeaningsForCurrentList(){

    if(!currentListName || words.length==0)
        return;

    try {

        let docId = makeSafeId(currentListName);

        let ref = window.fsDoc(window.db, "meanings", docId);

        let snap = await window.fsGetDoc(ref);

        if(snap.exists()){

            let data = snap.data();

            words.forEach(function(w){

                if(typeof data[w.id] == "string"){
                    w.pl = data[w.id];
                }

            });

        }

    }
    catch(error){

// Zapisuje poprawione znaczenie słówka do Firestore (tylko admin - reguły
// Firestore i tak to wymuszą, ale sprawdzamy też po stronie klienta)

// Obsługa przycisku "Aktualizuj" w polu edycji znaczenia
function updateMeaning(){

    if(!isAdmin() || current==null)
        return;

    let newMeaning =
    document.getElementById("meaningInput").value.trim();

    if(newMeaning == "")
        return;

    saveMeaningUpdate(current, newMeaning);

    document.getElementById("meaningEditBox").style.display = "none";

}

window.updateMeaning = updateMeaning;


// Formatuje pojedyncze pole do zapisu w csv (cudzysłów jeśli zawiera separator/cudzysłów)
function csvField(text, separator){

    if(text.includes(separator) || text.includes('"') || text.includes("\n")){
        return '"' + text.replaceAll('"','""') + '"';
    }

    return text;

}


// Buduje treść zaktualizowanego csv (oryginalny nagłówek + aktualne en/pl,
// czyli już z uwzględnieniem wszystkich poprawek znaczeń)
function buildCsvContent(){

    let lines = [csvHeaderLine];

    words.forEach(function(w){

        let enField = csvField(w.en, csvSeparator);

        let plField = csvField(w.pl, csvSeparator);

        lines.push(enField + csvSeparator + plField);

    });

    return lines.join("\r\n");

}


// Pobiera zaktualizowany plik csv (tylko admin)
function downloadUpdatedCsv(){

    if(!isAdmin() || words.length==0)
        return;

    let content = buildCsvContent();

    let blob = new Blob([content], { type: "text/csv;charset=utf-8;" });

    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");

    a.href = url;

    a.download = currentListName || "lista.csv";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

window.downloadUpdatedCsv = downloadUpdatedCsv;


// Aktualizuje licznik (do poprawy / pozostało / znam) oraz pasek postępu
function updateStats(){

    let counts = {
        below: 0,    // score < 0  -> do poprawy
        remaining: 0, // score == 0 -> pozostało
        known: 0     // score > 0  -> znam
    };

    words.forEach(function(w){

        let s = w.score || 0;

        if(s < 0){
            counts.below++;
        }
        else if(s == 0){
            counts.remaining++;
        }
        else{
            counts.known++;
        }

    });

    document.getElementById("stats").innerHTML =
    "<span>Do poprawy: " + counts.below + "</span>" +
    "<span>Pozostało: " + counts.remaining + "</span>" +
    "<span>Znam: " + counts.known + "</span>";


    let total = words.length;

    let belowPct = total > 0 ? (counts.below / total * 100) : 0;

    let remainingPct = total > 0 ? (counts.remaining / total * 100) : 0;

    let knownPct = total > 0 ? (counts.known / total * 100) : 0;

    document.getElementById("progressBar").innerHTML =
    '<div class="progress-below" style="width:' + belowPct + '%;" title="Do poprawy: ' + counts.below + '"></div>' +
    '<div class="progress-remaining" style="width:' + remainingPct + '%;" title="Pozostało: ' + counts.remaining + '"></div>' +
    '<div class="progress-known" style="width:' + knownPct + '%;" title="Znam: ' + counts.known + '"></div>';

}



// Losuje słówko z wagą zależną od wyniku - im gorszy wynik, tym częściej się trafia.
// Waga = (MAX_SCORE - score) + 1, więc zawsze >= 1 (każde słówko ma jakąś szansę).
function pickWeightedWord(){

    let weights = [];

    let totalWeight = 0;

    words.forEach(function(w){

        let weight = (MAX_SCORE - (w.score || 0)) + 1;

        weights.push(weight);

        totalWeight += weight;

    });

    let r = Math.random() * totalWeight;

    let acc = 0;

    for(let i=0; i<words.length; i++){

        acc += weights[i];

        if(r < acc){
            return words[i];
        }

    }

    return words[words.length-1];

}





function nextWord(){


    if(autoAdvanceTimer){
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
    }


    if(words.length==0)
        return;



    current = pickWeightedWord();



	let direction =
	document.getElementById("direction").value;


	let wordEl = document.getElementById("word");

	if(direction=="col1-col2"){

		wordEl.innerHTML =
		current.en;

	}
	else{

		wordEl.innerHTML =
		current.pl;

	}

	wordEl.classList.remove("word-bounce");

	void wordEl.offsetWidth; // wymuszenie reflow, żeby animacja odpaliła się ponownie za każdym razem

	wordEl.classList.add("word-bounce");


    document.getElementById("answer").value="";


    document.getElementById("result").innerHTML="";

    document.getElementById("overrideBtn").style.display="none";

    document.getElementById("meaningEditBox").style.display="none";

    clearAnswerFieldFlash();

    lastAnswerCorrect = null;

	checking = false;

}




// Enter (albo przycisk "Sprawdź") ma dwie role zależnie od stanu:
// - jeśli jeszcze nie sprawdzono odpowiedzi -> sprawdź ją
// - jeśli odpowiedź jest już pokazana (czekamy) -> przejdź do kolejnego słówka
function handleEnter(){

    if(checking){
        nextWord();
    }
    else{
        checkAnswer();
    }

}


function checkAnswer(){

	if(checking)
		return;

	checking = true;

    if(current==null)
        return;



    let answer =
    document.getElementById("answer")
    .value
    .toLowerCase()
    .trim();



	let direction =
	document.getElementById("direction").value;


	let correctAnswer;


	if(direction=="col1-col2"){

		correctAnswer = current.pl;

	}
	else{

		correctAnswer = current.en;

	}



	let dikiUrl =
	"https://www.diki.pl/slownik-angielskiego?q=" + encodeURIComponent(current.en);

	let dikiLink =
	'<div style="font-size:13px;margin-top:18px;">' +
	'<a href="' + dikiUrl + '" target="_blank" rel="noopener noreferrer">Sprawdź tłumaczenie</a>' +
	'</div>';

	let cambridgeSlug =
	current.en.trim().toLowerCase().replace(/\s+/g,"-");

	let cambridgeUrl =
	"https://dictionary.cambridge.org/dictionary/english/" + encodeURIComponent(cambridgeSlug);

	let cambridgeLink =
	'<div style="font-size:13px;margin-top:10px;">' +
	'<a href="' + cambridgeUrl + '" target="_blank" rel="noopener noreferrer">Cambridge Dictionary</a>' +
	'</div>';


	if(answer==correctAnswer.toLowerCase()){

		comboCount++;

		playCorrectSound(comboCount);

		flashAnswerField("correct-flash");

        current.score = clampScore((current.score||0) + 1);

        lastAnswerCorrect = true;

        updateComboDisplay();

        if(comboCount % 10 === 0){
            triggerConfettiBurst(true);
        }
        else if(comboCount % 5 === 0){
            triggerConfettiBurst(false);
        }

        document.getElementById("result").innerHTML=
        dikiLink + cambridgeLink;

        autoAdvanceTimer = setTimeout(nextWord, 1200);


    }
    else{

		playWrongSound();

		flashAnswerField("wrong-flash");

        current.score = clampScore((current.score||0) - 1);

        lastAnswerCorrect = false;

        comboBeforeWrongAnswer = comboCount;

        resetCombo();

        document.getElementById("result").innerHTML=
        correctAnswer + dikiLink + cambridgeLink;

        document.getElementById("overrideBtn").style.display="inline-block";

        if(isAdmin()){

            document.getElementById("meaningInput").value = current.pl;

            document.getElementById("meaningEditBox").style.display="block";

        }


    }


    updateStats();

    pulseScoreSegment(current.score);


    saveWordProgress(current);


}


// Gdy odpowiedź została uznana za złą, ale użytkownik twierdzi, że jednak
// miał rację - cofa karę (-1) i liczy jak za dobrą odpowiedź (+1), czyli
// łącznie +2 względem stanu sprzed korekty.
function overrideCorrect(){

    if(!checking || lastAnswerCorrect !== false)
        return;

    if(current==null)
        return;

    current.score = clampScore((current.score||0) + 2);

    // przywracamy combo tak, jakby ta odpowiedź od razu była dobra
    // (a nie liczymy je od zera, mimo że chwilę wcześniej combo się zresetowało)
    comboCount = comboBeforeWrongAnswer + 1;

    playCorrectSound(comboCount);

    updateComboDisplay();

    if(comboCount % 10 === 0){
        triggerConfettiBurst(true);
    }
    else if(comboCount % 5 === 0){
        triggerConfettiBurst(false);
    }

    updateStats();

    pulseScoreSegment(current.score);

    saveWordProgress(current);

    nextWord();

}


window.overrideCorrect = overrideCorrect;


window.addEventListener("keydown", function(e){

    if(e.key === "ArrowUp" && checking && lastAnswerCorrect === false){

        e.preventDefault();

        overrideCorrect();

    }

});
