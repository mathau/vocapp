<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<title>VocApp</title>

<style>

body {
    font-family: Arial;
    text-align: center;
    margin-top: 40px;
}

#word {
    font-size: 25px;
    margin: 30px;
}

input {
    font-size: 15px;
    padding: 10px;
}

button {
    font-size: 15px;
    padding: 5px 20px;
    margin: 10px;
}

#result {
    font-size: 28px;
    margin: 20px;
}

#stats {
    font-size: 14px;
    color: #444;
    margin: 15px;
}

#stats span {
    margin: 0 8px;
}

</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// UWAGA: firebaseConfig musi być zadeklarowane PRZED użyciem,
// i tylko raz (wcześniej było zdublowane, co powodowało błąd składni
// i przez to CAŁY skrypt się nie wykonywał - dlatego przycisk logowania nie działał)
const firebaseConfig = {
  apiKey: "AIzaSyCkMiql3H5AxIyFnrMV2k5smd0kJCXJ4nU",
  authDomain: "vocapp-d6988.firebaseapp.com",
  projectId: "vocapp-d6988",
  storageBucket: "vocapp-d6988.firebasestorage.app",
  messagingSenderId: "690642556103",
  appId: "1:690642556103:web:78c5e0f76c5528ead25ae2",
  measurementId: "G-Y15DGGKPNP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

async function loginGoogle(){

    try {

        const result = await signInWithPopup(
            auth,
            provider
        );

        document.getElementById("loginStatus").innerHTML =
        "Zalogowano: " + result.user.email;

        console.log(result.user);

    }
    catch(error){

        console.log(error);

        alert(
            "Błąd logowania: " + error.message
        );

    }

}

window.loginGoogle = loginGoogle;

window.signInWithPopup = signInWithPopup;


// Wystawiamy Firestore na window, żeby zwykły <script> (nie-module)
// mógł zapisywać/czytać postęp użytkownika
window.db = db;
window.fsDoc = doc;
window.fsSetDoc = setDoc;
window.fsGetDoc = getDoc;

window.currentUser = null;

onAuthStateChanged(auth, function(user){

    window.currentUser = user;

    document.getElementById("loginStatus").innerHTML =
    user ? "Zalogowano: " + user.email : "Nie zalogowano";

    // jeśli lista słówek jest już załadowana, doczytaj/odśwież postęp
    // (np. po odświeżeniu strony, gdy sesja jest zapamiętana)
    if(typeof window.onAuthChangedReloadProgress === "function"){
        window.onAuthChangedReloadProgress();
    }

});

</script>

</head>


<body>

<h1>VocApp</h1>

<button onclick="loginGoogle()">
Zaloguj przez Google
</button>

<p id="loginStatus">
Nie zalogowano
</p>

<select id="csvList" onchange="loadSelectedCsv()">
<option value="">
-- wybierz plik --
</option>
</select>

<p id="info">
Ładowanie listy plików...
</p>

<select id="direction" onchange="nextWord()">

<option value="pl-en">
Polski → English
</option>

<option value="en-pl">
English → Polski
</option>

</select>

<div id="stats">
<span>Do poprawy: 0</span>
<span>Nowe: 0</span>
<span>Znam: 0</span>
<span>Opanowane: 0</span>
</div>

<div id="word">
-
</div>


<input 
id="answer"
placeholder="Tłumaczenie"
onkeydown="if(event.key==='Enter') checkAnswer()"
>


<br>

<button onclick="checkAnswer()">
Sprawdź
</button>


<button onclick="nextWord()">
Pomiń
</button>


<div id="result"></div>


<script>


let words = [];

let current = null;

let checking = false;

let currentListName = null; // nazwa aktualnie wybranego pliku csv

// Zakres, w jakim mieści się wynik słówka. Ogranicza "uciekanie"
// wyniku w nieskończoność (jedna zła odpowiedź nie zniweczy 20 dobrych).
const MIN_SCORE = -3;
const MAX_SCORE = 5;

function clampScore(score){
    return Math.max(MIN_SCORE, Math.min(MAX_SCORE, score));
}


// tworzy stabilne, "bezpieczne" ID słówka na podstawie tekstu (do zapisu w Firestore)
function makeSafeId(text){

    return text
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // usuń polskie znaki diakrytyczne
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");

}


// ---- Konfiguracja repozytorium GitHub ----
// Zmień te wartości jeśli się nie zgadzają z Twoim repo
const GITHUB_OWNER = "mathau";
const GITHUB_REPO = "vocapp";
const GITHUB_BRANCH = "main";
const CSV_FOLDER = "wordbank"; // folder w repo, w którym trzymasz pliki csv
// -------------------------------------------


async function loadCsvFileList(){

    try {

        let url =
        "https://api.github.com/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO +
        "/contents/" + CSV_FOLDER + "?ref=" + GITHUB_BRANCH;

        let response = await fetch(url);

        if(!response.ok){

            document.getElementById("info").innerHTML =
            "Błąd ładowania listy plików (kod " + response.status + "). Sprawdź czy folder '" + CSV_FOLDER + "' istnieje w repo.";

            return;

        }

        let files = await response.json();

        let csvFiles = files.filter(function(f){
            return f.name.toLowerCase().endsWith(".csv");
        });

        let select = document.getElementById("csvList");

        select.innerHTML = '<option value="">-- wybierz plik --</option>';

        csvFiles.forEach(function(file){

            let option = document.createElement("option");

            option.value = file.download_url;

            option.textContent = file.name;

            select.appendChild(option);

        });

        document.getElementById("info").innerHTML =
        csvFiles.length > 0
        ? "Znaleziono " + csvFiles.length + " plik(ów) CSV. Wybierz z listy."
        : "Nie znaleziono plików CSV w folderze '" + CSV_FOLDER + "'.";

    }
    catch(error){

        console.log(error);

        document.getElementById("info").innerHTML =
        "Błąd: " + error.message;

    }

}


async function loadSelectedCsv(){

    let select = document.getElementById("csvList");

    let url = select.value;

    if(url == "")
        return;

    currentListName = select.options[select.selectedIndex].textContent;

    document.getElementById("info").innerHTML = "Ładowanie pliku...";

    try {

        let response = await fetch(url);

        let text = await response.text();

        await loadWords(text);

    }
    catch(error){

        console.log(error);

        document.getElementById("info").innerHTML =
        "Błąd ładowania pliku: " + error.message;

    }

}


window.loadSelectedCsv = loadSelectedCsv;

window.addEventListener("DOMContentLoaded", loadCsvFileList);




async function loadWords(text){


    words=[];


    let lines=text.split(/\r?\n/);


    // wykrycie separatora

    let separator=",";

    if(lines[0].includes(";")){
        separator=";";
    }



    for(let i=1;i<lines.length;i++){


        if(lines[i].trim()=="")
            continue;



        let row=lines[i].split(separator);



        if(row.length>=2){


            let en = row[0].replaceAll('"',"").trim();

            let pl = row[1].replaceAll('"',"").trim();

            words.push({

                id: makeSafeId(en),

                en: en,

                pl: pl,

                score: 0

            });


        }


    }



    await loadProgressForCurrentList();


    updateStats();


    document.getElementById("info").innerHTML =
    "Załadowano: "+words.length+" słówek";


    nextWord();


}


// Doczytuje zapisany postęp (wyniki słówek) dla aktualnie wybranej listy
// i danego zalogowanego użytkownika. Jeśli nikt nie jest zalogowany - nic nie robi.
async function loadProgressForCurrentList(){

    if(!window.currentUser || !currentListName || words.length==0)
        return;

    try {

        let docId = window.currentUser.uid + "_" + makeSafeId(currentListName);

        let ref = window.fsDoc(window.db, "progress", docId);

        let snap = await window.fsGetDoc(ref);

        if(snap.exists()){

            let data = snap.data();

            words.forEach(function(w){

                if(typeof data[w.id] == "number"){
                    w.score = data[w.id];
                }

            });

        }

    }
    catch(error){

        console.log(error);

    }

}


// Zapisuje wynik pojedynczego słówka do Firestore (jeśli użytkownik jest zalogowany)
async function saveWordProgress(wordObj){

    if(!window.currentUser || !currentListName)
        return;

    try {

        let docId = window.currentUser.uid + "_" + makeSafeId(currentListName);

        let ref = window.fsDoc(window.db, "progress", docId);

        let payload = {};

        payload[wordObj.id] = wordObj.score;

        await window.fsSetDoc(ref, payload, { merge: true });

    }
    catch(error){

        console.log(error);

    }

}


// Wywoływane z modułu Firebase, gdy zmieni się stan logowania
// (np. użytkownik się zaloguje albo strona odświeży się z zapamiętaną sesją)
window.onAuthChangedReloadProgress = async function(){

    if(words.length > 0){
        await loadProgressForCurrentList();
        updateStats();
    }

};


// Aktualizuje licznik: do poprawy / nowe / znam / opanowane
function updateStats(){

    let counts = {
        below: 0,   // score < 0
        fresh: 0,   // score == 0
        learning: 0, // score 1-2
        mastered: 0  // score > 2
    };

    words.forEach(function(w){

        let s = w.score || 0;

        if(s < 0){
            counts.below++;
        }
        else if(s == 0){
            counts.fresh++;
        }
        else if(s <= 2){
            counts.learning++;
        }
        else{
            counts.mastered++;
        }

    });

    document.getElementById("stats").innerHTML =
    "<span>Do poprawy: " + counts.below + "</span>" +
    "<span>Nowe: " + counts.fresh + "</span>" +
    "<span>Znam: " + counts.learning + "</span>" +
    "<span>Opanowane: " + counts.mastered + "</span>";

}


// Losuje słówko z wagą zależną od wyniku - im gorszy wynik, tym częściej się trafia.
// Waga = (MAX_SCORE - score) + 1, więc zawsze >= 1 (każde słówko ma jakąś szansę).
function pickWeightedWord(){

    let weights = [];

    let totalWeight = 0;

    words.forEach(function(w){

        let weight = (MAX_SCORE - (w.score || 0)) + 1;

        weights.push(weight);

        totalWeight += weight;

    });

    let r = Math.random() * totalWeight;

    let acc = 0;

    for(let i=0; i<words.length; i++){

        acc += weights[i];

        if(r < acc){
            return words[i];
        }

    }

    return words[words.length-1];

}





function nextWord(){


    if(words.length==0)
        return;



    current = pickWeightedWord();



	let direction =
	document.getElementById("direction").value;


	if(direction=="en-pl"){

		document.getElementById("word").innerHTML =
		current.en;

	}
	else{

		document.getElementById("word").innerHTML =
		current.pl;

	}


    document.getElementById("answer").value="";


    document.getElementById("result").innerHTML="";

	checking = false;

}




function checkAnswer(){

	if(checking)
		return;

	checking = true;

    if(current==null)
        return;



    let answer =
    document.getElementById("answer")
    .value
    .toLowerCase()
    .trim();



	let direction =
	document.getElementById("direction").value;


	let correctAnswer;


	if(direction=="en-pl"){

		correctAnswer = current.pl;

	}
	else{

		correctAnswer = current.en;

	}



	if(answer==correctAnswer.toLowerCase()){


        current.score = clampScore((current.score||0) + 1);

        document.getElementById("result").innerHTML=
        "✅";


    }
    else{


        current.score = clampScore((current.score||0) - 1);

        document.getElementById("result").innerHTML=
        "❌ "+correctAnswer


    }


    updateStats();


    saveWordProgress(current);


    setTimeout(nextWord,1500);


}
	
</script>


</body>

</html>
